<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark squircle container for high contrast across both light and dark browser tabs -->
  <rect width="100" height="100" rx="22" fill="#0a0b10"/>
  <!-- Seat Backrest -->
  <rect x="25" y="38" width="50" height="34" rx="8" fill="#dc143c"/>
  <!-- Armrests -->
  <rect x="18" y="50" width="6" height="24" rx="3" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="76" y="50" width="6" height="24" rx="3" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Seat Cushion Base -->
  <rect x="20" y="74" width="60" height="8" rx="4" fill="#ffffff"/>
  <!-- Sightline Ray -->
  <line x1="50" y1="36" x2="50" y2="23" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 5"/>
  <!-- Vantage Viewpoint Dot -->
  <circle cx="50" cy="16" r="7.5" fill="#dc143c"/>
  <circle cx="50" cy="16" r="3.2" fill="#ffffff"/>
</svg>
